name: Build APK

# Compila el APK debug de OffBeat en la nube.
# Sube el código → sale el artifact "offbeat-debug" para instalar en el celular.
on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK debug
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: OffBeat-app/offbeat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: OffBeat-app/offbeat/package-lock.json

      # JDK 21 es obligatorio: Capacitor 8 no compila con 17.
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK (compileSdk 36)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Dependencias npm
        run: npm ci

      # sync = copy (www -> Android) + update (genera capacitor-cordova-android-plugins/)
      - name: Sync web → Android
        run: npx cap sync android

      - name: Compilar APK debug
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir artifact offbeat-debug
        uses: actions/upload-artifact@v4
        with:
          name: offbeat-debug
          path: OffBeat-app/offbeat/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
